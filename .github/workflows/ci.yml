name: Routiq CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  detect-changes:
    name: Detect what to run
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      is-main-target: ${{ steps.target.outputs.isMain }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine target branch
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET="${{ github.base_ref }}"
          else
            TARGET="${{ github.ref_name }}"
          fi
          if [ "$TARGET" = "main" ]; then
            echo "isMain=true" >> $GITHUB_OUTPUT
          else
            echo "isMain=false" >> $GITHUB_OUTPUT
          fi
          echo "Target: $TARGET, isMain: $(cat $GITHUB_OUTPUT | grep isMain)"

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  # ============================================================
  # BACKEND - FAST (all PRs): lint + unit tests (2 shards)
  # ============================================================
  backend-fast:
    name: Backend (lint + unit)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        if: matrix.shard == 1
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx jest --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # ============================================================
  # BACKEND - HEAVY (main only): integration + E2E + regression
  # ============================================================
  backend-heavy:
    name: Backend (integration + E2E)
    needs: [detect-changes, backend-fast]
    if: |
      needs.detect-changes.outputs.backend == 'true' &&
      needs.detect-changes.outputs.is-main-target == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routiq_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"

      - name: E2E & regression tests
        run: npm run test:e2e
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5433/routiq_test?schema=public"

  # ============================================================
  # FRONTEND - FAST (all PRs): lint + type-check + unit tests (2 shards)
  # ============================================================
  frontend-fast:
    name: Frontend (lint + types + unit)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        if: matrix.shard == 1
        run: npm run lint

      - name: TypeScript type-check
        if: matrix.shard == 1
        run: npm run type-check

      - name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # ============================================================
  # FRONTEND - HEAVY (main only): build + E2E
  # ============================================================
  frontend-heavy:
    name: Frontend (build + E2E)
    needs: [detect-changes, frontend-fast]
    if: |
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.detect-changes.outputs.is-main-target == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build check
        run: npm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'].replace('^', ''))")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests
        run: npm run test:e2e
